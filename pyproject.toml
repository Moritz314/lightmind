[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lightmind"
version = "0.1.3"
description = "Lightmind core: Markdown-driven agent harness (tools + instructions + data, checked by rules)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "claude-agent-sdk>=0.2.168",
    "pyrage>=1.1",
    "pillow>=10",
]

[project.optional-dependencies]
tui = ["textual>=8"]
daemon = ["aiohttp>=3.9", "asyncssh>=2.14", "pyrage>=1.1", "croniter>=2.0"]
pc = ["mss", "pyautogui", "pywinauto; sys_platform == 'win32'"]
browser = ["playwright>=1.45"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-xdist>=3"]

[project.scripts]
lm = "lightmind.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lightmind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: needs a real provider account (run with -m live)",
    "tui: starts a whole Textual app (Orbit) with the Pilot; set automatically by tests/conftest.py. Daily run: -m \"not tui and not slow and not live and not install\"",
    "slow: takes several seconds on its own",
    "install: end-to-end install test, downloads uv, Python and packages, takes minutes (run with -m install)",
]
addopts = "-m 'not live and not install'"
